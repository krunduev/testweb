# ── Web Service Benchmark Configuration ──────────────────────────────────────

# Duration of each load stage. After each stage the ramp increases.
stage_duration: "30s"

# Maximum number of concurrent goroutines.
# 20-core machine comfortably handles 2000+ concurrent workers.
max_workers: 2000

# Worker counts for the ramp-up test.
# Any value > max_workers is ignored automatically.
stages: [10, 25, 50, 100, 200, 400, 800, 1200, 1600, 2000]

# Fibonacci N for /fibonacci endpoint (recursive — CPU-bound).
fib_n: 35

# Bytes to allocate per /alloc request.
alloc_size: 1048576   # 1 MB

# Stop ramping a service when error rate exceeds this threshold (%).
err_threshold: 5.0

# Stop ramping a service when P99 latency exceeds this threshold (ms).
p99_threshold: 5000.0

# Output HTML report path.
output_html: "report.html"

# Pause between individual load stages (lets service stabilise).
cooldown: "2s"

# Per-request HTTP timeout.
request_timeout: "5s"

# ── Services ─────────────────────────────────────────────────────────────────
services:
  - name: stdlib-ej
    url: http://localhost:8081

  - name: gin-ej
    url: http://localhost:8082

  - name: fiber-ej
    url: http://localhost:8083

  - name: spring
    url: http://localhost:8084

  - name: dotnet
    url: http://localhost:8085

  - name: stdlib
    url: http://localhost:8086

  - name: gin
    url: http://localhost:8087

  - name: fiber
    url: http://localhost:8088
